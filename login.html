{% extends 'base.html' %}

{% block title %}Teacher Login - Attendance Analytics System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="mb-2">
                <i class="bi bi-person-workspace display-5"></i>
            </div>
            <h4 class="fw-bold mb-1">Teacher Portal</h4>
            <p class="small text-white-50 mb-0">Sign in to manage classes and analyze attendance</p>
        </div>

        <div class="auth-body">
            <form method="POST" action="{{ url_for('login') }}" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@college.edu" required autofocus value="{{ email|default('') }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom text-white w-100 py-2 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="mt-4 p-3 bg-light rounded-3 border">
                <div class="d-flex align-items-start gap-2">
                    <i class="bi bi-info-circle text-primary fs-5 mt-1"></i>
                    <div>
                        <strong class="d-block small text-dark">Default Demo Teacher Account:</strong>
                        <span class="small text-muted d-block"><strong>Email:</strong> <code>teacher@example.com</code></span>
                        <span class="small text-muted d-block"><strong>Password:</strong> <code>teacher123</code></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
